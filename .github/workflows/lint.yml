name: Web launch quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-launch-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-mobile:
    name: Windows mobile preparation
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # Reserved offline fixture: validates bundling without production credentials.
      NEXT_PUBLIC_API_BASE_URL: 'https://mobile-api.invalid'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies from lockfile
        run: npm.cmd ci --no-audit --no-fund

      - name: Check launch dependencies
        run: npm.cmd run check:launch-execution-plan

      - name: Check generated manual checklist
        run: npm.cmd run check:manual-launch-checklist

      - name: Check shared mobile types
        run: npx.cmd tsc --noEmit --project tsconfig.mobile.json

      - name: Check actual Capacitor config loader and Windows generation guard
        run: npx.cmd tsx tests/ios-bootstrap-config.test.ts

      - name: Check native auth preparation and installed SDK compatibility
        run: |
          npm.cmd run check:auth-sdk-patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx.cmd tsx tests/capacitor-auth-storage.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx.cmd tsx tests/auth-storage-initialization.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx.cmd tsx tests/capacitor-auth-plugin-packaging.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx.cmd tsx tests/capacitor-camera.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx.cmd tsx tests/camera-flow-integration.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx.cmd tsx tests/ios-media-configuration.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx.cmd tsx tests/capacitor-files.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx.cmd tsx tests/capacitor-file-preview-packaging.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx.cmd tsx tests/capacitor-interactions.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx.cmd tsx tests/native-platform-startup.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx.cmd tsx tests/ios-links-configuration.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx.cmd tsx tests/mobile-segment-aliases.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx.cmd tsx tests/ios-navigation-configuration.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx.cmd tsx tests/ios-unsigned-build.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx.cmd tsx tests/ios-platform-workflow-integration.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build bundled mobile assets
        run: npm.cmd run build:mobile:api

      - name: Verify asset and server boundaries
        run: npm.cmd run verify:mobile

      - name: Verify static routes
        run: npm.cmd run smoke:mobile

      - name: Verify tracked source files remain unchanged
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code

  hex-budget:
    name: Hex token budget
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Budget is allowed to be tightened but not loosened without an
      # explicit PR to docs/audit/known-violations.md (see .cursorrules).
      - name: Run hex budget check
        env:
          # Default: 0. Any new hex violation fails the build. To add a hex:
          # 1. Add the new hex to HEX_ALLOWLIST in eslint.config.mjs (justified)
          # 2. Update docs/audit/known-violations.md
          MAX_HEX_BUDGET: '0'
        run: node scripts/lint-hex.js

  web-quality:
    name: Lint, tests, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint

      - name: Run complete test manifest
        run: npm test

      - name: Build production Web application without deployment secrets
        run: npm run build

      - name: Verify tests and build did not modify tracked files
        run: |
          git diff --check
          git diff --exit-code
